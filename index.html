
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maps</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 14px;
      background: white;
      box-shadow: 0 2px 5px #0002;
      position: relative;
      z-index: 1000;
    }

    .brand {
      font-size: 22px;
      color: #4285f4;
      font-weight: bold;
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid #ddd;
      border-radius: 25px;
      font-size: 15px;
    }

    #map {
      width: 100%;
      height: calc(100vh - 80px);
    }

    #status {
      position: absolute;
      z-index: 1000;
      bottom: 18px;
      left: 12px;
      right: 12px;
      background: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 8px #0002;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">Maps</div>
    <input id="search" placeholder="Cari tempat di peta...">
  </header>

  <div id="map"></div>
  <div id="status">Meminta izin lokasi perangkat...</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map').setView([-6.9932, 110.4203], 13);

    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }
    ).addTo(map);

    let marker = null;
    const status = document.getElementById('status');

    function getLocation() {
      if (!navigator.geolocation) {
        status.textContent = 'Browser tidak mendukung GPS.';
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(pos) {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;

          map.setView([lat, lng], 17);

          if (marker) map.removeLayer(marker);

          marker = L.marker([lat, lng])
            .addTo(map)
            .bindPopup('Lokasi perangkat ini')
            .openPopup();

          status.textContent =
            'Latitude: ' + lat.toFixed(6) +
            ' | Longitude: ' + lng.toFixed(6);
        },
        function(err) {
          status.textContent =
            err.code === 1
              ? 'Izin lokasi ditolak.'
              : 'Lokasi tidak tersedia. Periksa GPS dan izin browser.';
        },
        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    }

    window.addEventListener('load', getLocation);

    document.getElementById('search').addEventListener(
      'keydown', async function(e) {
        if (e.key !== 'Enter' || !this.value.trim()) return;

        try {
          const url =
            'https://nominatim.openstreetmap.org/search?format=json&limit=1&q='
            + encodeURIComponent(this.value.trim());

          const response = await fetch(url);
          const data = await response.json();

          if (data.length) {
            map.setView([+data[0].lat, +data[0].lon], 16);
          }
        } catch {
          status.textContent = 'Pencarian gagal. Coba lagi.';
        }
      }
    );
  </script>
</body>
</html>
