
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bagikan Lokasi</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #202124;
    }

    header {
      padding: 14px;
      background: white;
      box-shadow: 0 2px 5px #0002;
    }

    .brand {
      font-size: 22px;
      color: #4285f4;
      font-weight: bold;
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 25px;
    }

    #map {
      width: 100%;
      height: 55vh;
    }

    .panel {
      padding: 18px;
    }

    button {
      padding: 13px 18px;
      background: #1a73e8;
      color: white;
      border: 0;
      border-radius: 24px;
      font-size: 15px;
      cursor: pointer;
    }

    #status, #coords {
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">Maps</div>
    <input id="search" placeholder="Cari tempat...">
  </header>

  <div id="map"></div>

  <section class="panel">
    <p id="status">Memeriksa lokasi perangkat...</p>
    <p id="coords"></p>
    <button id="shareButton" hidden>Bagikan koordinat melalui email</button>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script>
    const EMAILJS_PUBLIC_KEY = "JzuOyCTWQn_58ncCd";
    const EMAILJS_SERVICE_ID = "service_873xl3f";
    const EMAILJS_TEMPLATE_ID = "template_g80wg71";

    emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

    const map = L.map("map").setView([-6.9932, 110.4203], 13);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);

    const status = document.getElementById("status");
    const coords = document.getElementById("coords");
    const shareButton = document.getElementById("shareButton");

    let marker = null;
    let currentLocation = null;

    function getLocation() {
      if (!navigator.geolocation) {
        status.textContent = "Browser tidak mendukung GPS.";
        return;
      }

      status.textContent = "Meminta izin lokasi perangkat...";

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          currentLocation = { lat, lng };

          map.setView([lat, lng], 17);

          if (marker) map.removeLayer(marker);

          marker = L.marker([lat, lng])
            .addTo(map)
            .bindPopup("Lokasi perangkat ini")
            .openPopup();

          coords.textContent =
            "Latitude: " + lat.toFixed(6) +
            "\nLongitude: " + lng.toFixed(6);

          status.textContent =
            "Lokasi ditemukan. Pilih tombol di bawah jika ingin membagikannya melalui email.";

          shareButton.hidden = false;
        },
        function(error) {
          status.textContent =
            error.code === 1
              ? "Izin lokasi ditolak. Periksa pengaturan browser."
              : "Lokasi tidak tersedia. Aktifkan GPS dan coba lagi.";
        },
        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    }

    shareButton.addEventListener("click", async function() {
      if (!currentLocation) return;

      const approved = confirm(
        "Koordinat GPS Anda akan dikirim ke alamat email penerima " +
        "yang telah dikonfigurasi. Lanjutkan?"
      );

      if (!approved) return;

      shareButton.disabled = true;
      status.textContent = "Mengirim email...";

      try {
        await emailjs.send(
          EMAILJS_SERVICE_ID,
          EMAILJS_TEMPLATE_ID,
          {
            latitude: currentLocation.lat.toFixed(6),
            longitude: currentLocation.lng.toFixed(6),
            time: new Date().toLocaleString("id-ID"),
            maps_link:
              "https://www.google.com/maps?q=" +
              currentLocation.lat + "," +
              currentLocation.lng
          }
        );

        status.textContent = "Email berhasil dikirim.";
      } catch (error) {
        status.textContent =
          "Email gagal dikirim. Periksa konfigurasi EmailJS.";
      } finally {
        shareButton.disabled = false;
      }
    });

    document.getElementById("search").addEventListener(
      "keydown", async function(event) {
        if (event.key !== "Enter" || !this.value.trim()) return;

        try {
          const response = await fetch(
            "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
            encodeURIComponent(this.value.trim())
          );

          const data = await response.json();

          if (data.length) {
            map.setView([+data[0].lat, +data[0].lon], 16);
          }
        } catch {
          status.textContent = "Pencarian gagal. Coba lagi.";
        }
      }
    );

    window.addEventListener("load", getLocation);
  </script>
</body>
</html>
